name: monitor

on:
  schedule:
    # Every 20 minutes. The run loops internally; while one block is running,
    # scheduled triggers queue (concurrency) and the next one takes over the
    # moment the current block exits — covering the day in 6h+6h style.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  # one long block at a time; the next scheduled run waits in the queue and
  # starts as soon as the current block ends (no PAT needed for the handoff)
  group: ${{ github.event_name == 'schedule' && 'loop' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # just under GitHub's 6h job cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore snapshot DB (catalog persists; history trimmed in code)
        uses: actions/cache@v4
        with:
          path: monitor.db
          key: monitor-db-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            monitor-db-

      - name: Write localized texts (optional)
        if: ${{ env.LOCALE_JSON != '' }}
        run: printf '%s' "$LOCALE_JSON" > locale.local.json
        env:
          LOCALE_JSON: ${{ secrets.LOCALE_JSON }}

      - name: Run (internal loop holds the ~20-min cadence; queue chains blocks)
        run: python main.py --ci-loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPPLIER_BASE_URL: ${{ secrets.SUPPLIER_BASE_URL }}
          TZ_NAME: ${{ secrets.TZ_NAME }}
          LOCALE_FILE: locale.local.json
          FETCH_WORKERS: "10"
          RETAIN_DAYS: "3"

      # Scheduled workflows in inactive public repos are paused after 60 days.
      - name: Keepalive (re-enable schedule)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" > /dev/null 2>&1 || true
