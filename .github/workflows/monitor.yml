name: monitor

on:
  schedule:
    # Every 20 minutes, Mon–Fri, roughly covering the market work window
    # (UTC 06:00–18:00 ≈ Kyiv 08:00–21:00). Exact gating is done in code by
    # the market-local time, so timezone/DST never breaks the schedule.
    - cron: "*/20 6-18 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore snapshot DB (catalog persists; history trimmed in code)
        uses: actions/cache@v4
        with:
          path: monitor.db
          key: monitor-db-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            monitor-db-

      - name: Write localized texts (optional)
        if: ${{ env.LOCALE_JSON != '' }}
        run: printf '%s' "$LOCALE_JSON" > locale.local.json
        env:
          LOCALE_JSON: ${{ secrets.LOCALE_JSON }}

      - name: Run one pass
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPPLIER_BASE_URL: ${{ secrets.SUPPLIER_BASE_URL }}
          TZ_NAME: ${{ secrets.TZ_NAME }}
          LOCALE_FILE: locale.local.json
          FETCH_WORKERS: "10"
          RETAIN_DAYS: "3"
